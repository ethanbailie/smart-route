apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: smart-route-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: {storage: 10Gi}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-route
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: smart-route}}
  template:
    metadata: {labels: {app: smart-route}}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, fsGroup: 65532}
      containers:
        - name: control-plane
          image: ghcr.io/example/smart-route:v0.1.0
          args: ["--config", "/etc/smart-route/config.yaml", "serve"]
          ports: [{name: http, containerPort: 8080}]
          readinessProbe: {httpGet: {path: /readyz, port: http}, periodSeconds: 5}
          livenessProbe: {httpGet: {path: /healthz, port: http}, periodSeconds: 10}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: config, mountPath: /etc/smart-route, readOnly: true}
            - {name: data, mountPath: /var/lib/smart-route}
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: config
          configMap: {name: smart-route}
        - name: data
          persistentVolumeClaim: {claimName: smart-route-data}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: smart-route
spec:
  selector: {app: smart-route}
  ports: [{name: http, port: 8080, targetPort: http}]
